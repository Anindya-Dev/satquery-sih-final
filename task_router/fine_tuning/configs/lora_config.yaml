# LoRA / QLoRA Fine-Tuning Configuration for SatQuery AI Task Router
model:
  base_model_name_or_path: "Qwen/Qwen2.5-1.5B-Instruct"  # Lightweight, high JSON accuracy
  torch_dtype: "bfloat16"
  use_4bit: true                                       # QLoRA for low VRAM consumption (~4GB)
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  use_nested_quant: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "./models/satquery_task_router_lora"
  train_data_path: "task_router/fine_tuning/data/train_chatml.jsonl"
  val_data_path: "task_router/fine_tuning/data/val_chatml.jsonl"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 2
  max_seq_length: 1024
